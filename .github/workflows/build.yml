name: Build BlaBlAI (.exe & .dmg)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to trigger the build manually with a button in GitHub

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Icon Asset
        run: |
          python -c "from gui.assets import ensure_icon_file; ensure_icon_file()"

      - name: Build Standalone .exe with PyInstaller
        run: |
          pyinstaller --noconsole --onefile `
            --name "BlaBlAI" `
            --add-data "styles.css;." `
            --add-data "blablai_icon.png;." `
            --collect-all customtkinter `
            --collect-all reportlab `
            --collect-all PIL `
            app.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlaBlAI-Windows-x64
          path: dist/BlaBlAI.exe

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Icon Asset
        run: |
          python3 -c "from gui.assets import ensure_icon_file; ensure_icon_file()"

      - name: Build macOS App Bundle
        run: |
          pyinstaller --windowed --noconfirm \
            --name "BlaBlAI" \
            --add-data "styles.css:." \
            --add-data "blablai_icon.png:." \
            --collect-all customtkinter \
            --collect-all reportlab \
            --collect-all PIL \
            app.py

      - name: Create Native .dmg Disk Image
        run: |
          hdiutil create -volname "BlaBlAI" -srcfolder "dist/BlaBlAI.app" -ov -format UDZO "dist/BlaBlAI.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlaBlAI-macOS-Universal
          path: dist/BlaBlAI.dmg