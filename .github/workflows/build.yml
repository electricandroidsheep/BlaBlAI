name: Build & Release BlaBlAI (.exe & .dmg)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14 (Tcl/Tk 9.0 with TIP 684 TouchpadScroll)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Tcl/Tk 9.0+ & Run Unit Test Suite
        run: |
          python -c "import tkinter as tk; print('Tcl/Tk patchlevel:', tk.Tcl().eval('info patchlevel'))"
          python -m unittest discover tests -v

      - name: Generate Icon Asset
        run: |
          python -c "from gui.assets import ensure_icon_file; ensure_icon_file()"

      - name: Build Standalone .exe with PyInstaller
        run: |
          pyinstaller BlaBlAI.spec --clean --noconfirm

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlaBlAI-Windows-x64
          path: dist/BlaBlAI.exe

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14 (Tcl/Tk 9.0 with TIP 684 TouchpadScroll)
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Tcl/Tk & Run Core Protocol Tests
        run: |
          python3 -m unittest tests/test_protocol.py -v

      - name: Generate Icon Asset
        run: |
          python3 -c "from gui.assets import ensure_icon_file; ensure_icon_file()"

      - name: Build macOS App Bundle
        run: |
          pyinstaller --windowed --noconfirm \
            --name "BlaBlAI" \
            --add-data "styles.css:." \
            --add-data "blablai_icon.png:." \
            --collect-all customtkinter \
            --collect-all reportlab \
            --collect-all PIL \
            app.py

      - name: Create Native .dmg Disk Image
        run: |
          hdiutil create -volname "BlaBlAI" -srcfolder "dist/BlaBlAI.app" -ov -format UDZO "dist/BlaBlAI.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlaBlAI-macOS-Universal
          path: dist/BlaBlAI.dmg

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: BlaBlAI-Windows-x64
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: BlaBlAI-macOS-Universal
          path: release-assets

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          name: "BlaBlAI ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            release-assets/BlaBlAI.exe
            release-assets/BlaBlAI.dmg